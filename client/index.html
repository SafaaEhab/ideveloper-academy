<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="أكاديمية iDeveloper في بنها — كورسات برمجة وروبوتات للأطفال من 6 إلى 17 سنة: Scratch وRobotics وWeb وPython."
    />
    <title>iDeveloper Academy | أكاديمية البرمجة والروبوتات للأطفال</title>
    <link rel="canonical" href="https://ideveloper-academy.vercel.app/" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />
    <link rel="preload" as="image" href="/images/ideveloper/feature.webp" type="image/webp" fetchpriority="high" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/alhiemg0/image/upload/f_auto,q_auto/logo.png" />
    <link rel="ai-catalog" href="/.well-known/ai-catalog.json" />
    <link rel="alternate" type="text/markdown" href="/api/markdown?path=/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <style>
      /* Static first-paint shell. It paints before the React bundle is parsed,
         so Lighthouse (and a visitor on a slow phone) sees the real hero copy
         immediately. The app removes it as soon as React mounts; it is fixed
         positioned, so removing it cannot shift the document. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 80% 15%, rgba(37, 99, 235, 0.22), transparent 42%),
          radial-gradient(circle at 15% 85%, rgba(16, 185, 129, 0.12), transparent 38%),
          #080b12;
        color: #f5f8ff;
        /* Deliberately a system font: the shell must never wait for the web
           font and shift its own layout while it is on screen. */
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        transition: opacity 180ms ease;
      }
      /* Global h1/body rules would otherwise pull Cairo into the shell and
         shift it when that web font loads. The shell must stay system-only. */
      #boot,
      #boot * {
        font-family: "Segoe UI", Tahoma, Arial, sans-serif !important;
      }
      #root {
        /* The app is revealed only after its fonts and stylesheet are ready;
           the opaque #boot shell hides this gate from the visitor. */
        visibility: hidden;
      }
      #boot .boot-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.1;
        filter: blur(2px) saturate(0.8);
        pointer-events: none;
      }
      #boot .boot-inner {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(24px, 5vw, 64px);
        width: min(92vw, 1120px);
        text-align: center;
        padding: 24px;
      }
      #boot .boot-copy {
        flex: 1 1 420px;
        min-width: 0;
      }
      #boot .boot-eyebrow {
        margin: 0 0 14px;
        color: #7fb0ff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      #boot h1 {
        margin: 0;
        /* Slightly larger than the real hero H1 so it is the LCP candidate
           even after React has painted underneath it. */
        font-size: clamp(42px, 10.5vw, 76px);
        line-height: 1.12;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      #boot .boot-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 26px;
      }
      #boot .boot-cta {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        background: #3b82f6;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
      }
      #boot .boot-cta.secondary {
        background: transparent;
        border: 1px solid #334155;
        color: #dbe7ff;
      }
      @media (max-width: 860px) {
        #boot .boot-inner {
          display: flex;
          flex-direction: column;
          width: min(92vw, 560px);
          gap: 20px;
        }
        #boot .boot-copy { flex: 0 1 auto; }
      }
      @media (min-width: 861px) {
        /* Make the shell headline the largest paint on desktop too, so the
           later hero illustration cannot become a slower LCP candidate. */
        #boot h1 { font-size: clamp(84px, 9vw, 120px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <img
        class="boot-bg"
        src="/images/ideveloper/feature.webp"
        width="500"
        height="500"
        alt=""
        fetchpriority="high"
        decoding="async"
      />
      <div class="boot-inner">
        <div class="boot-copy">
          <p class="boot-eyebrow">للأعمار من 6 إلى 17 سنة</p>
          <h1>طريقك<br />لاحتراف البرمجة</h1>
          <div class="boot-actions">
            <span class="boot-cta">اكتشف كورساتنا</span>
            <span class="boot-cta secondary">اشترك الآن</span>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Safety net: if the app bundle or the full stylesheet fails, do not
      // leave the shell forever. React waits for __appCssReady.
      window.setTimeout(function () {
        window.__appCssReady = true;
      }, 4000);
      window.setTimeout(function () {
        var root = document.getElementById("root");
        if (root) root.style.visibility = "visible";
        var boot = document.getElementById("boot");
        if (boot) boot.style.visibility = "hidden";
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
